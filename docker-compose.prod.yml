services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?Define WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:?Define WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:?Define WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:?Define WHATSAPP_APP_SECRET}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:?Define WHATSAPP_API_VERSION}
      WHATSAPP_GRAPH_TIMEOUT_SECONDS: ${WHATSAPP_GRAPH_TIMEOUT_SECONDS:-15}
      WHATSAPP_CONVERSATION_TTL_MINUTES: ${WHATSAPP_CONVERSATION_TTL_MINUTES:-1440}
      WHATSAPP_RATE_LIMIT_PER_MINUTE: ${WHATSAPP_RATE_LIMIT_PER_MINUTE:-20}
      WHATSAPP_TEMPLATE_RECEPCION: ${WHATSAPP_TEMPLATE_RECEPCION:-}
      WHATSAPP_TEMPLATE_PROGRAMACION: ${WHATSAPP_TEMPLATE_PROGRAMACION:-}
      WHATSAPP_TEMPLATE_RECOLECCION: ${WHATSAPP_TEMPLATE_RECOLECCION:-}
      WHATSAPP_TEMPLATE_CANCELACION: ${WHATSAPP_TEMPLATE_CANCELACION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:?Define OPENAI_MODEL}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:?Define OPENAI_TRANSCRIPTION_MODEL}
      USE_EXTERNAL_SERVICES: "true"
      MODO_PILOTO: ${MODO_PILOTO:-true}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Define BACKEND_CORS_ORIGINS}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_HUERTEROS_PASSWORD: ${DEMO_HUERTEROS_PASSWORD:-}
      DEMO_RECICLADORES_PASSWORD: ${DEMO_RECICLADORES_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Define NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Define NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_prod_data:
