services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ecoconecta-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecoconecta}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoconecta-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecoconecta}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ecoconecta}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-ecoconecta_verify}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_GRAPH_TIMEOUT_SECONDS: ${WHATSAPP_GRAPH_TIMEOUT_SECONDS:-15}
      WHATSAPP_CONVERSATION_TTL_MINUTES: ${WHATSAPP_CONVERSATION_TTL_MINUTES:-1440}
      WHATSAPP_RATE_LIMIT_PER_MINUTE: ${WHATSAPP_RATE_LIMIT_PER_MINUTE:-20}
      WHATSAPP_MAX_RETRIES: ${WHATSAPP_MAX_RETRIES:-3}
      WHATSAPP_TEMPLATE_RECEPCION: ${WHATSAPP_TEMPLATE_RECEPCION:-}
      WHATSAPP_TEMPLATE_PROGRAMACION: ${WHATSAPP_TEMPLATE_PROGRAMACION:-}
      WHATSAPP_TEMPLATE_RECOLECCION: ${WHATSAPP_TEMPLATE_RECOLECCION:-}
      WHATSAPP_TEMPLATE_CANCELACION: ${WHATSAPP_TEMPLATE_CANCELACION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      USE_EXTERNAL_SERVICES: ${USE_EXTERNAL_SERVICES:-false}
      MODO_PILOTO: ${MODO_PILOTO:-false}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_HUERTEROS_PASSWORD: ${DEMO_HUERTEROS_PASSWORD:-}
      DEMO_RECICLADORES_PASSWORD: ${DEMO_RECICLADORES_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./database/seeds:/app/seeds
    command: >
      sh -c "
        alembic upgrade head &&
        python seeds/seed_data.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoconecta-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
