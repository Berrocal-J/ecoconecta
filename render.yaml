# Blueprint de Render: PostgreSQL + API (FastAPI) + Web (Next.js), todo con Docker.
# Render > New > Blueprint > selecciona este repositorio.
databases:
  - name: ecoconecta-db
    plan: free
    databaseName: ecoconecta
    user: ecoconecta

services:
  - type: web
    name: ecoconecta-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && python seeds/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecoconecta-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: USE_EXTERNAL_SERVICES
        value: "false"
      - key: MODO_PILOTO
        value: "false"
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: BACKEND_CORS_ORIGINS
        sync: false   # URL del frontend, ej. https://ecoconecta-web.onrender.com
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_HUERTEROS_PASSWORD
        sync: false
      - key: DEMO_RECICLADORES_PASSWORD
        sync: false

  - type: web
    name: ecoconecta-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false   # URL del API, ej. https://ecoconecta-api.onrender.com
